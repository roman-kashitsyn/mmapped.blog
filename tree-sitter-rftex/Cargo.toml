[package]
name = "tree-sitter-rftex"
description = "rftex grammar for tree-sitter"
version = "0.1.0"
license = "CC-BY-4.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "rftex"]
categories = ["parser-implementations", "parsing", "text-editors"]
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25"

[package]
name = "tree-sitter-rftex"
authors = ["Roman Kashitsyn <roman.kashitsyn@gmail.com>"]
description = "rftex grammar for tree-sitter"
repository = "https://github.com/roman-kashitsyn/mmapped.blog"
homepage = "https://mmapped.blog"
documentation = "https://docs.rs/tree-sitter-rftex"
version = "0.1.1"
license = "CC-BY-4.0"
readme = "README.md"
links = "tree-sitter-rftex"
rust-version = "1.77"
keywords = ["incremental", "parsing", "tree-sitter", "rftex"]
categories = ["parser-implementations", "parsing", "text-editors"]
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25"

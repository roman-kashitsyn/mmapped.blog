on: [pull_request]

name: Build website
jobs:
  grammar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tree-sitter-rftex

      - name: Install grammar dependencies
        working-directory: tree-sitter-rftex
        run: npm ci

      - name: Run grammar tests
        run: make grammar-test

  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache local opam state
        uses: actions/cache@v4
        with:
          path: |
            opam/2.3.0/root
            opam/2.3.0/local-switch
          key: ${{ runner.os }}-opam-${{ hashFiles('Makefile', 'dune-project') }}

      - name: Install dependencies
        run: make deps

      - name: Run tests
        run: make test

      - name: Render the site
        run: make render DEST=site

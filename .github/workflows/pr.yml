on:
  push:
    branches: [main]
  pull_request:

name: Build website

permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress. Runs on main are
# never cancelled, so a production deployment always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  grammar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install grammar dependencies
        working-directory: tree-sitter-rftex
        run: npm ci

      - name: Run grammar tests
        run: make grammar-test

  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Run parser tests
        run: make syntax-test

      - name: Run engine tests
        run: make engine-test

      - name: Check the site
        run: make check

  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache local opam state
        uses: actions/cache@v4
        with:
          path: |
            opam/2.3.0/root
            opam/2.3.0/local-switch
          key: ${{ runner.os }}-opam-${{ hashFiles('Makefile', 'dune-project') }}

      - name: Install dependencies
        run: make deps

      - name: Run tests
        run: make test

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Compare the Rust parser with the OCaml one
        run: make diff-ast

      - name: Compare the site the Rust engine builds with the OCaml one
        run: make diff-site

      - name: Render the site
        run: make render DEST=site

      # blogware exits with status 0 even when rendering fails, so make sure the
      # output is there before it replaces the live site.
      - name: Check the rendered site
        run: test -s site/index.html && test -s site/feed.xml && test -s site/posts.html

      # A push to main deploys to production; a pull request deploys a preview under
      # the name of its branch. Pull requests from forks have no access to the token,
      # so they stop after the checks above.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 880d6a8c80226e3cbbd921dd8fdccc30
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEPLOY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=mmapped-blog \
            --branch="$DEPLOY_BRANCH" \
            --commit-hash="$DEPLOY_COMMIT" \
            --commit-dirty=true | tee deploy.log
          {
            echo "### Deployed to Cloudflare Pages"
            grep -o 'https://[^ ]*\.pages\.dev' deploy.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

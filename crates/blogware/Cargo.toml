[package]
name = "blogware"
version = "0.1.0"
edition = "2021"
authors = ["Roman Kashitsyn <roman.kashitsyn@gmail.com>"]
description = "The engine of mmapped.blog: checks, renders and serves the site"
repository = "https://github.com/roman-kashitsyn/mmapped.blog"
license = "CC-BY-4.0"
publish = false

[dependencies]
annotate-snippets = "0.12.18"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
rftex-doc = { path = "../rftex-doc" }
rftex-syntax = { path = "../rftex-syntax" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
